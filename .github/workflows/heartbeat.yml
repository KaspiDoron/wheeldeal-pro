# THE BACKSTOP PINGER - a heartbeat that needs no GCP permissions.
#
# Nothing in this app moves on its own. A queued message, a strategic wait, a
# three-minute check-back on a quiet thread: each is a row with a due time and
# no timer behind it, and every drain runs inside an HTTP request handler. With
# the traveller's phone locked and no shop replying, a due row waits.
#
# Cloud Scheduler (provisioned by deploy-gcp.yml) is the primary heartbeat and
# fires every minute. But it needs roles the deploying service account may not
# have been granted, and when it silently failed to be created the owner's
# dashboard read "last drain: never" while the app looked perfectly healthy.
#
# A watchdog with a single source of failure is not a watchdog. This one runs
# on GitHub's own schedule, needs only the secrets this repo already holds, and
# keeps the queue draining even if nobody ever grants the scheduler role.
#
# GitHub cron is BEST-EFFORT and coarse (5 minutes, often later under load) -
# which is exactly why it is the backstop and not the primary. Both write the
# same `cron-ping` breadcrumb, so Admin -> Keys shows the true age either way.

name: Queue heartbeat

# WHY THIS IS HOURLY AND NOT EVERY FIVE MINUTES.
#
# GitHub bills a MINIMUM OF ONE MINUTE per job run, however short the job is.
# This job is a single curl that finishes in seconds, so at */5 it cost
# 288 runs/day = ~8,640 billed minutes a month - more than four times the entire
# 2,000-minute monthly allowance a private repo gets for free, spent entirely on
# rounding. That is what pushed this account to 90% of its allowance.
#
# The cadence is therefore hourly: a genuine last-ditch backstop, ~720 minutes a
# month, leaving the rest of the allowance for CI.
#
# THIS IS NOT THE REAL FIX, AND IT SHOULD NOT BE TREATED AS ONE. The primary
# heartbeat is Cloud Scheduler (provisioned by deploy-gcp.yml, every minute,
# effectively free). The correct SECOND opinion is an external uptime monitor -
# UptimeRobot's free tier does 5-minute checks at no cost and, unlike this
# workflow, actually ALERTS somebody when the drain stops. SCALING.md section 5
# has the setup. Once both of those are confirmed live, this file can be deleted
# outright.
#
# Two other ways to stop paying, for the record:
#   - A PUBLIC repository gets UNLIMITED free Actions minutes. The allowance
#     only applies to private repos.
#   - Setting a $0 Actions budget in billing settings blocks overage spend
#     instead of billing it.
on:
  schedule:
    # Hourly. See the note above before making this finer-grained again.
    - cron: "0 * * * *"
  workflow_dispatch: {}

# One ping at a time. A backed-up runner queue must never stack pings.
concurrency:
  group: wheeldeal-heartbeat
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the drain
        env:
          # The public app origin. Falls back to the Cloud Run URL secret when
          # no custom domain is set.
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          SERVICE_URL: ${{ secrets.CLOUD_RUN_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          # The rotation salt the app folds into the same token (audit
          # F179/M10). Dropping it here 403'd the backstop the moment the
          # owner used the documented rotation knob.
          WEBHOOK_TOKEN_SALT: ${{ secrets.WEBHOOK_TOKEN_SALT }}
        run: |
          set -uo pipefail
          BASE="${APP_DOMAIN:-${SERVICE_URL:-}}"
          if [ -z "$BASE" ]; then
            echo "No APP_DOMAIN or CLOUD_RUN_URL secret set - nothing to ping."
            echo "Set either one so the backstop heartbeat can reach the app."
            exit 0
          fi
          case "$BASE" in
            http://*|https://*) ;;
            *) BASE="https://$BASE" ;;
          esac
          # Same derivation as src/lib/wa/webhook-token.ts - no new secret,
          # and the optional salt folded in exactly as the app folds it.
          SALTED="wd-webhook:$SESSION_SECRET"
          if [ -n "${WEBHOOK_TOKEN_SALT:-}" ]; then SALTED="$SALTED:$WEBHOOK_TOKEN_SALT"; fi
          TOKEN="$(printf '%s' "$SALTED" | sha256sum | cut -c1-32)"
          CODE="$(curl -sS -o /tmp/ping.out -w '%{http_code}' --max-time 60 \
            "$BASE/api/wa/ping?token=$TOKEN" || echo 000)"
          echo "HTTP $CODE"
          head -c 500 /tmp/ping.out || true
          echo ""
          # A failed ping must not turn the repo's checks red - the next one is
          # five minutes away, and a red X here would train the owner to ignore
          # a signal that matters. Report and move on.
          if [ "$CODE" != "200" ]; then
            echo "::warning::Heartbeat ping returned $CODE - check Admin -> Keys for the drain age."
          fi
