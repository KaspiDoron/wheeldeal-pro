# WheelDeal - build + deploy to GCP Cloud Run.
#
# Required repository secrets:
#   GCP_SA_KEY                     - JSON key of a service account with roles:
#                                    Artifact Registry Writer, Cloud Run Admin,
#                                    Service Account User, and - for the queue
#                                    heartbeat - Cloud Scheduler Admin +
#                                    Service Usage Admin. Without the last two
#                                    the deploy still succeeds and the app runs,
#                                    but NOTHING drains the queue while the
#                                    owner's phone is closed: the step below
#                                    says so loudly instead of failing silently,
#                                    and .github/workflows/heartbeat.yml keeps
#                                    pinging every 5 minutes as a backstop.
#   GCP_PROJECT_ID                 - the GCP project id
#   SUPABASE_URL                   - bootstrap runtime env (see CLAUDE.md Deploy)
#   SUPABASE_SERVICE_ROLE_KEY
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  - also a BUILD arg (inlined client-side)
#   SESSION_SECRET
#   ADMIN_EMAILS
#   Optional: EVOLUTION_API_URL, EVOLUTION_API_KEY, EVOLUTION_HOSTS, APP_DOMAIN
#   Optional: SESSION_SECRET_PREVIOUS - the recovery path for a ROTATED
#                                    SESSION_SECRET. That one secret is BOTH the
#                                    cookie signing key and the Key Vault's
#                                    encryption key, so changing it makes every
#                                    stored integration key undecryptable at
#                                    once: the app comes up healthy with every
#                                    integration blank. runtime-config already
#                                    tries this old value when decrypting, and
#                                    it had NO WAY TO REACH THE SERVICE - the
#                                    documented recovery was documented only.
#
# Every other integration key (LLM providers, PayPal, Resend, Maps...) lives in
# the Supabase-backed admin Key Vault and needs NO redeploy - only the bootstrap
# set above is passed to the service.

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - master
      # The active development branch - runs `verify` on push, never `deploy`.
      - claude/rental-agents-legal-setup-o7rgcv
      #
      # `claude/rental-negotiation-app-pc33ux` used to be listed here and was
      # described as "the live production branch". It has not existed on the
      # remote for a long time - `git ls-remote --heads` returns only master and
      # the two claude/* branches above - and master is what actually deploys.
      # Keeping the dead name was not harmless: it is what pointed Render's
      # blueprint at that branch, so every Manual Sync failed with
      # "not found: file: .../render.yaml" - a real file, on a branch that is
      # gone. A stale branch name in config is a live misconfiguration
      # somewhere else.
  pull_request:
  workflow_dispatch: {}

# TWO SCOPES, BECAUSE THEY WANT OPPOSITE THINGS.
#
# CI is disposable: a superseded pull-request run is pure waste and should be
# cancelled. A deploy is not: cancelling a run mid-`gcloud run deploy` kills the
# process between its read of the service and its write, which is one of the
# ways the resource-version conflict below gets created in the first place.
#
# So the workflow-level group is per-ref and only cancels PR runs (which never
# reach the deploy job at all - see the `if` on it), and the deploy JOB has its
# own global, never-cancelled lane further down.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGION: asia-southeast1            # Singapore - closest to the SE-Asia market
  REPOSITORY: wheeldeal              # Artifact Registry docker repo name
  SERVICE: wheeldeal                 # Cloud Run service name

jobs:
  # QUALITY GATE - typecheck (root + services) + the full vitest suite. Nothing
  # ships to Cloud Run unless this is green (the `deploy` job `needs: verify`),
  # so a red build can no longer reach production. Runs on every push/PR.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Typecheck (root)
        run: npm run typecheck
      - name: Typecheck (gateway + workers)
        run: npm run typecheck:services
      # THE TESTS WERE THE ONLY CODE OUTSIDE THE TYPE CHECKER.
      #
      # The root tsconfig excludes **/*.test.ts (it must - `next build` would
      # otherwise compile them into the app), so 216 files, the ones standing
      # between this codebase and the field, were never checked. The first run
      # found 20 real errors: tests passing shapes the function does not accept,
      # asserting on a move that had been renamed away, and treating a message
      # INDEX as a timestamp.
      - name: Typecheck (tests)
        run: npm run typecheck:tests
      - name: Unit + integration tests
        run: npx vitest run
      # THE FOURTH PART OF A GATE THAT CLAIMED TO HAVE FOUR.
      #
      # CLAUDE.md says to validate with `npm run typecheck && npm run build`,
      # and the build was never in CI - so a change that type-checked and
      # tested green could still fail to build, and the first anyone knew was
      # the deploy job minutes later, after the image had already been built
      # once. It runs here, before anything is pushed anywhere.
      # THE BUILD REACHES OUT TO THE INTERNET, AND THE INTERNET SOMETIMES SAYS NO.
      #
      # `next/font/google` downloads every face at BUILD time (that is how it
      # self-hosts them - there is no runtime Google dependency). layout.tsx
      # declares 15 families whose subsets x weights come to ~89 woff2 files
      # plus 15 CSS lookups: ~104 requests to fonts.googleapis.com /
      # fonts.gstatic.com on every cold build. next/font retries each file 3
      # times and then throws, and the throw is not a readable network error -
      # it surfaces as `TypeError: Cannot read properties of null (reading '1')`
      # inside the font loader, which reads like a code bug and is not one.
      #
      # Observed rate: 1 failure in the last 30 runs (~3%). Small, until you
      # notice the SAME fetch happens again inside `docker build` on the deploy
      # path - so a coin-flip against a Google edge node could fail a
      # production deploy of code that is perfectly fine.
      #
      # Two mitigations, in order of how often they save us:
      #   1. `.next/cache` is restored below, so an unchanged layout.tsx reuses
      #      the cached font modules and makes ZERO network requests. (It also
      #      silences the "No build cache found" warning and speeds the build.)
      #   2. When the cache misses and a fetch does fail, retry the whole build
      #      rather than failing the run. The build is idempotent; a transient
      #      blip is not a reason to make a human re-run the job.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          # Source hash so a real code change gets a fresh compile; the
          # restore-key still hands us the previous cache to reuse the
          # unchanged modules (which is what saves the font fetches).
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-
      - name: Build
        run: |
          set -uo pipefail
          for ATTEMPT in 1 2 3; do
            if npm run build; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              echo "::warning::Build attempt $ATTEMPT failed. next/font fetches ~104 files from fonts.gstatic.com at build time; a transient failure there fails the whole build. Retrying."
              sleep $((ATTEMPT * 15))
            fi
          done
          echo "::error::Build failed 3 times - this is not a transient font fetch, look at the compile errors above."
          exit 1
      # THE BROWSER GATE (owner report 3, wave 4.1 - owner decision 6: hard
      # gate). The repo's own history: a fully green unit suite missed every
      # symptom the owner photographed, because they were BROWSER facts - a
      # mid-screen tab bar, a wordmark spelled backwards, an error that
      # rendered nowhere. The journey suite runs against the production build
      # from the step above (playwright.config.ts webServer boots `next
      # start`), so nothing deploys with a broken journey.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser journeys (Playwright)
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: verify
    # Only the production branches actually deploy; the dev branch + PRs stop
    # after `verify` (they still get the full quality gate above).
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # ONE DEPLOY LANE FOR THE WHOLE REPOSITORY, AND IT IS NEVER INTERRUPTED.
    # A literal group (not keyed by ref) means a push to master and a manual
    # dispatch queue behind each other instead of both issuing a
    # read-modify-write against the same Cloud Run service. `cancel-in-progress:
    # false` is deliberate and is the opposite of what it looks like: killing an
    # in-flight deploy is what leaves the service half-updated.
    concurrency:
      group: deploy-cloud-run-wheeldeal
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "$REPOSITORY" \
            --location="$REGION" --project="${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "$REPOSITORY" \
            --repository-format=docker \
            --location="$REGION" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --description="WheelDeal container images"

      # KEEP THE LAST FEW IMAGES, NOT ALL OF THEM.
      #
      # Every deploy pushes two tags (:$SHA and :latest) and nothing ever
      # deleted one. A Next standalone node:20-slim image is ~300-500 MB and
      # the Artifact Registry free tier is 0.5 GB, so this quietly grew into a
      # small monthly bill that nobody would connect to deploying. Idempotent
      # and best-effort: a policy failure must never fail a deploy, and rolling
      # back is still possible within the retained window.
      - name: Keep Artifact Registry bounded
        continue-on-error: true
        run: |
          cat > /tmp/ar-cleanup.json <<'JSON'
          [
            {
              "name": "keep-recent",
              "action": {"type": "Keep"},
              "mostRecentVersions": {"keepCount": 5}
            },
            {
              "name": "delete-stale",
              "action": {"type": "Delete"},
              "condition": {"olderThan": "30d"}
            }
          ]
          JSON
          gcloud artifacts repositories set-cleanup-policies "$REPOSITORY" \
            --location="$REGION" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --policy=/tmp/ar-cleanup.json \
            --quiet || echo "cleanup policy not applied (non-fatal)"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          set -uo pipefail
          IMAGE="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$REPOSITORY/$SERVICE"
          # `Dockerfile:45` runs `npm run build` INSIDE the image, in a fresh
          # container with no `.next/cache` - so this is the second, and the
          # more expensive, place the ~104 build-time Google-Fonts requests
          # happen. The verify job's cache cannot help here. A blip must not
          # fail a production deploy of good code, so the same bounded retry
          # applies. Docker does not cache a failed RUN layer, so a retry
          # genuinely re-runs the build rather than replaying the failure.
          for ATTEMPT in 1 2 3; do
            if docker build \
              --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}" \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              --build-arg NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}" \
              --build-arg WD_BUILD_SHA="${{ github.sha }}" \
              --build-arg WD_BUILD_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -t "$IMAGE:${{ github.sha }}" \
              -t "$IMAGE:latest" \
              . ; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              echo "::warning::Image build attempt $ATTEMPT failed - retrying (transient font/registry fetches are the usual cause)."
              sleep $((ATTEMPT * 15))
            fi
          done
          echo "::error::Image build failed 3 times - not transient, read the compile errors above."
          exit 1

      - name: Push image
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$REPOSITORY/$SERVICE"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        # SECRETS ARRIVE AS ENVIRONMENT VARIABLES, NOT AS TEXT PASTED INTO A
        # SHELL SCRIPT. `${{ secrets.X }}` is substituted before bash ever sees
        # the line, so a value containing a quote, a `$`, a backtick or a
        # newline used to rewrite the script around it. It also broke the
        # optional-secret guards: with an unset secret, `[ -n "" ]` was written
        # as `[ -n ]`, which bash evaluates as "is the string '-n' non-empty" -
        # true - so every optional key was appended EMPTY, overwriting a good
        # value already on the service. Referenced as `$VAR` none of that is
        # possible and the guards mean what they say.
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_HOSTS: ${{ secrets.EVOLUTION_HOSTS }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          # THE OPTIONAL LOOP BELOW READS SHELL VARIABLES, SO A SECRET THAT IS
          # NOT EXPORTED HERE CAN NEVER BE PASSED. REDIS_URL was added to that
          # loop and NOT to this block, so setting the repo secret would have
          # silently done nothing while the owner believed the daily caps had
          # become fleet-wide. The env-vs-loop drift test in
          # src/lib/deploy-env.test.ts now fails if the two lists disagree.
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SESSION_SECRET_PREVIOUS: ${{ secrets.SESSION_SECRET_PREVIOUS }}
          # BETA_LOCK is an owner TOGGLE, not a secret (OR11 D2.1). Sourced from a
          # repo VARIABLE so a deploy PRESERVES it: --set-env-vars replaces the
          # whole service env, so an owner who set BETA_LOCK=off in the Cloud Run
          # console had it WIPED on the next push and the beta silently re-locked
          # (allowlist.ts defaults an absent value to "on"). Unset here = absent =
          # locked, which is the safe default.
          BETA_LOCK: ${{ vars.BETA_LOCK }}
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE"
          # ^##^ makes gcloud split on ## instead of "," so secret values may
          # safely contain commas (e.g. ADMIN_EMAILS, EVOLUTION_HOSTS).
          # WHAT IS ACTUALLY SERVING. Stamped into the running service so
          # /api/admin/deploy-info can answer "is the fix I just shipped live?"
          # from the owner's phone, instead of it being an act of faith.
          # AN EMPTY SECRET IS A WIPE, NOT A NO-OP.
          #
          # --set-env-vars REPLACES the service's entire environment, and these
          # five were appended unconditionally - so a repo secret that is unset
          # or empty did not "leave the old value alone", it OVERWROTE the live
          # value with "". The 2026-08-02 run proves it: ADMIN_EMAILS came
          # through blank, and ADMIN_EMAILS is the ONLY source of
          # getSession().isAdmin - a successful deploy would have silently
          # locked the owner out of /admin, every /api/admin/* route and the
          # billing routes, with a green checkmark on the run.
          #
          # So: check first, fail by NAME, and never ship a service configured
          # by an accident. This runs before the deploy command, so the failure
          # costs seconds and says exactly which secret to set.
          MISSING=""
          for REQUIRED in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_ANON_KEY SESSION_SECRET ADMIN_EMAILS; do
            if [ -z "${!REQUIRED:-}" ]; then
              MISSING="$MISSING $REQUIRED"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required repo secret(s):$MISSING"
            echo "Set them under Settings -> Secrets and variables -> Actions."
            echo "Deploying without them would OVERWRITE the live service's values with empty strings."
            echo "ADMIN_EMAILS in particular is the only thing that makes anyone an admin -"
            echo "an empty value locks the owner out of /admin and every /api/admin/* route."
            exit 1
          fi

          ENV_VARS="WD_BUILD_SHA=$IMAGE_TAG"
          ENV_VARS="$ENV_VARS##WD_BUILD_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ENV_VARS="$ENV_VARS##SUPABASE_URL=$SUPABASE_URL"
          ENV_VARS="$ENV_VARS##SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          ENV_VARS="$ENV_VARS##NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          ENV_VARS="$ENV_VARS##SESSION_SECRET=$SESSION_SECRET"
          ENV_VARS="$ENV_VARS##ADMIN_EMAILS=$ADMIN_EMAILS"
          # REDIS_URL (owner report 4, scale #2): without it the atomic daily
          # caps in wa-guard fall back to a per-process in-memory counter, so
          # with --max-instances 20 each cap is enforced up to 20x. Passed here
          # (optional - absent just keeps the documented in-memory caveat) so
          # the moment a Redis endpoint is reachable from Cloud Run the caps
          # become fleet-wide with no code change.
          for OPTIONAL in EVOLUTION_API_URL EVOLUTION_API_KEY EVOLUTION_HOSTS APP_DOMAIN REDIS_URL SESSION_SECRET_PREVIOUS BETA_LOCK; do
            VALUE="${!OPTIONAL:-}"
            if [ -n "$VALUE" ]; then
              ENV_VARS="$ENV_VARS##$OPTIONAL=$VALUE"
            fi
          done

          # ABORTED IS A RACE, NOT A BAD DEPLOY.
          #
          #   ERROR: (gcloud.run.deploy) ABORTED: Conflict for resource
          #   'wheeldeal': version '...656665' was specified but current version
          #   is '...401735'.
          #
          # `gcloud run deploy` reads the service, applies the change and writes
          # it back with the version it read. Anything that touches the service
          # in between makes that write stale - and it is NOT only a second
          # pipeline: Cloud Run's own reconciliation bumps the version as the
          # previous revision finishes rolling out and traffic migrates, which
          # can land after the previous deploy command has already returned. The
          # concurrency lane above stops us racing ourselves; this stops us
          # racing the platform. The command is declarative, so re-running it is
          # idempotent - the retry re-reads the fresh version and re-applies the
          # SAME image and env.
          ATTEMPTS=5
          DELAY=10
          for i in $(seq 1 "$ATTEMPTS"); do
            set +e
            # --timeout 90, not 300 (owner report 8). `export const maxDuration`
            # is a VERCEL-only hint and does nothing on a standalone Next
            # server, so the comments in wa/tick and reply-tick claiming the
            # routes "stay well inside maxDuration=60" describe a guard that
            # does not exist. The real ceiling is this flag - and at 300 a
            # single hung upstream (Evolution, a provider) holds a concurrency
            # slot for five minutes. Nothing in-process exceeds ~45s.
            #
            # SCALE SHAPE (owner report 4, scale #3). --concurrency 32 lets one
            # instance serve many simultaneous requests (the app is I/O-bound on
            # Supabase + Evolution, not CPU-bound); --min-instances 1 kills the
            # cold-start latency that made the first request after idle slow
            # (~$10-15/mo for the warm instance, inside the $50-100 envelope);
            # --max-instances 20 headroom for hundreds of concurrent users.
            OUT="$(gcloud run deploy "$SERVICE" \
              --image "$IMAGE:$IMAGE_TAG" \
              --region "$REGION" \
              --platform managed \
              --allow-unauthenticated \
              --quiet \
              --port 8080 \
              --memory 1Gi \
              --cpu 1 \
              --concurrency 32 \
              --min-instances 1 \
              --max-instances 20 \
              --timeout 90 \
              --set-env-vars "^##^$ENV_VARS" 2>&1)"
            CODE=$?
            set -e
            echo "$OUT"
            if [ "$CODE" -eq 0 ]; then
              echo "Deployed on attempt $i."
              exit 0
            fi
            # Only a version conflict is retried. A bad image, a missing
            # permission or an invalid flag must fail immediately and loudly -
            # retrying those just hides the real error five times over.
            if ! echo "$OUT" | grep -qiE 'ABORTED|Conflict for resource|version .* was specified'; then
              echo "Deploy failed for a reason that will not fix itself - not retrying."
              exit "$CODE"
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "Resource version moved under us; re-reading and retrying in ${DELAY}s (attempt $i of $ATTEMPTS)."
              sleep "$DELAY"
              DELAY=$((DELAY * 2))
            fi
          done
          echo "Still conflicting after $ATTEMPTS attempts - something else is writing to this service."
          exit 1

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --format="value(status.url)"

      # THE HEARTBEAT. Without this, nothing in the system moves unless an HTTP
      # request happens to arrive.
      #
      # A queued message, a strategic wait, a three-minute check-back on a quiet
      # thread: every one of them is a row with a due time and NO timer behind
      # it. The drains run inside request handlers - the webhook, the app's own
      # polling - so with the owner's phone locked and no shop replying, a due
      # row simply waits. The only periodic drain artifact this repo ever had is
      # render.yaml's cron, which is a Render.com resource and does exactly
      # nothing for a service running on Cloud Run, and the documented fallback
      # was an out-of-repo cron-job.org job that PRODUCTION-READINESS.md itself
      # flags as a single point of failure nobody would notice lapsing.
      #
      # Cloud Scheduler is the GCP-native answer: 3 jobs free, one HTTP call a
      # minute, provisioned here so it exists as long as the service does.
      #
      # Note on CPU: we deliberately do NOT pass --no-cpu-throttling. It would
      # flip this service to instance-based billing (charged for idle time,
      # which a once-a-minute ping makes continuous) and it is not needed for
      # correctness - every drain and dispatcher kick is now awaited inside its
      # own request rather than left running after the response (see
      # src/lib/wa/kick.ts).
      - name: Ensure the drain heartbeat exists
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.url)')"
          if [ -z "$URL" ]; then
            echo "No service URL yet - skipping scheduler wiring."
            exit 0
          fi
          # Same derivation as src/lib/wa/webhook-token.ts: the ping route
          # accepts the webhook token, so the schedule needs no new secret.
          TOKEN="$(printf 'wd-webhook:%s' "$SESSION_SECRET" | sha256sum | cut -c1-32)"
          TARGET="$URL/api/wa/ping?token=$TOKEN"
          JOB="wheeldeal-drain"

          # FAILURES HERE USED TO BE INVISIBLE, WHICH IS HOW THE HEARTBEAT CAME
          # TO READ "never". `gcloud services enable ... || true` swallowed the
          # permission error, the create then 403'd, and the deploy had already
          # printed a green service URL. The service was live and unwatched.
          #
          # The deploying service account needs TWO roles beyond the documented
          # three (Artifact Registry Writer, Cloud Run Admin, Service Account
          # User). If they are missing we say exactly that, print the commands
          # that fix it, and DO NOT fail the deploy - the app is fine, it is the
          # watchdog that is missing, and the GitHub-Actions backstop
          # (.github/workflows/heartbeat.yml) keeps the queue draining meanwhile.
          fail_loudly() {
            echo ""
            echo "=============================================================="
            echo "ACTION REQUIRED - the queue heartbeat was NOT provisioned."
            echo "=============================================================="
            echo "Reason: $1"
            echo ""
            echo "Grant the deploy service account these two roles, once:"
            echo "  gcloud projects add-iam-policy-binding $PROJECT_ID \\"
            echo "    --member=serviceAccount:<the GCP_SA_KEY account> \\"
            echo "    --role=roles/cloudscheduler.admin"
            echo "  gcloud projects add-iam-policy-binding $PROJECT_ID \\"
            echo "    --member=serviceAccount:<the GCP_SA_KEY account> \\"
            echo "    --role=roles/serviceusage.serviceUsageAdmin"
            echo ""
            echo "Or create the job by hand (one command, never repeated):"
            echo "  gcloud services enable cloudscheduler.googleapis.com"
            echo "  gcloud scheduler jobs create http $JOB \\"
            echo "    --location $REGION --schedule '* * * * *' \\"
            echo "    --uri '<service-url>/api/wa/ping?token=<token>' \\"
            echo "    --http-method GET --attempt-deadline 60s"
            echo ""
            echo "Until then the GitHub Actions backstop pings every 5 minutes,"
            echo "and Admin -> Keys shows the heartbeat age either way."
            echo "=============================================================="
            exit 0
          }

          if ! gcloud services enable cloudscheduler.googleapis.com --quiet 2>&1; then
            fail_loudly "could not enable the Cloud Scheduler API (needs roles/serviceusage.serviceUsageAdmin)"
          fi

          if gcloud scheduler jobs describe "$JOB" --location "$REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$JOB" \
              --location "$REGION" \
              --schedule "* * * * *" \
              --uri "$TARGET" \
              --http-method GET \
              --attempt-deadline 60s \
              --quiet || fail_loudly "could not UPDATE the scheduler job (needs roles/cloudscheduler.admin)"
          else
            gcloud scheduler jobs create http "$JOB" \
              --location "$REGION" \
              --schedule "* * * * *" \
              --uri "$TARGET" \
              --http-method GET \
              --attempt-deadline 60s \
              --quiet || fail_loudly "could not CREATE the scheduler job (needs roles/cloudscheduler.admin)"
          fi

          # VERIFY, rather than trust the exit code. A job that exists is the
          # only evidence that matters, and this is the line that would have
          # caught the original silent failure.
          if gcloud scheduler jobs describe "$JOB" --location "$REGION" \
              --format='value(schedule,state)' 2>/dev/null | grep -q .; then
            echo "Heartbeat verified:"
            gcloud scheduler jobs describe "$JOB" --location "$REGION" \
              --format='value(name,schedule,state)'
          else
            fail_loudly "the job did not exist after writing it"
          fi
