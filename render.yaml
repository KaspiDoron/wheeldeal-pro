# WheelDeal WhatsApp backend on Render - SMALLEST PAID setup (robust, no sleep).
#
# HOW A CHANGE TO THIS FILE ACTUALLY REACHES RENDER - read this first.
#
# This file only takes effect when somebody APPLIES it, and editing it on a
# feature branch changes nothing until the change reaches `master`.
#
# THE BLUEPRINT IS CURRENTLY BROKEN, ON RENDER'S SIDE, AND IS OPTIONAL.
# Manual Sync fails with "not found: file:
# github.com/KaspiDoron/wheeldeal-pro/render.yaml" while the Blueprint's own
# Settings show Branch = `master` and Blueprint Path = `render.yaml`. The repo
# side is verified clean four ways: this file is a normal committed file at the
# repo ROOT on `master`, it is not gitignored, it is the only root-level YAML,
# and a GitHub API read of that exact path at refs/heads/master returns it. The
# 404 is generated inside Render - its UI even contradicts itself, with the
# breadcrumb still naming a branch deleted months ago. The repo rename
# Rental-App -> wheeldeal-pro is the likely trigger.
#
# THEREFORE: to apply a change here, do it BY HAND in the Render dashboard
# (add/edit the service or cron directly). That is not a workaround so much as
# the safer path anyway - a Blueprint sync restarts wd-evolution and drops every
# linked WhatsApp socket at once, while adding a cron touches nothing else.
#
# To attempt a repair: Disconnect Blueprint (this does NOT delete services) and
# create a new one from `master`; services are adopted by NAME. If the repo is
# missing from the picker, Render's GitHub App lost it in the rename
# (Render -> Settings -> GitHub -> Configure). If the Blueprint's Sync Hook URL
# fails identically, it is a Render-side fault for a support ticket.
#
# The free Evolution fleet (deploy/fleet/README.md) retires Render entirely,
# and this whole problem with it. Do not over-invest in fixing it.
#
# Render reads this Blueprint, builds the Evolution API image from
# deploy/evolution/Dockerfile, provisions a Postgres database AND a free Redis
# (Key Value) cache, and wires the connection strings automatically. After it
# deploys, copy the service URL and paste it into the app at Owner -> Keys ->
# EVOLUTION_HOSTS as:  https://<service>.onrender.com|<API key>
#
# Cost: web `starter` ~$7/mo + Postgres `basic-256mb` ~$6/mo. Redis is free.
# What the money buys: the service NEVER sleeps (no cold starts, no dropped
# WhatsApp sockets), and the database never expires (free Postgres dies after
# ~30 days). This is the smallest paid combo that is launch-grade.
#
# CRASH FIX (502/503, "OnWhatsappCache ... PrismaClientKnownRequestError"):
# Evolution's "is this number on WhatsApp" cache fell through to Prisma/Postgres
# and crashed the process. Fixed here two ways:
#   1. A real Redis cache (free Key Value instance) - the cache never touches
#      Prisma again (CACHE_REDIS_ENABLED=true).
#   2. DATABASE_SAVE_IS_ON_WHATSAPP=false - stop persisting those rows at all.
# To apply: set these env vars by hand on wd-evolution -> Environment (the
# Blueprint's Manual Sync is broken Render-side; see the header). Note that
# saving an env var RESTARTS the service and drops linked sockets, so do it
# when no tester is mid-hunt.
#
# CRASH FIX 2 ("Exited with status 1" alerts during pairing):
# Status 1 is an UNCAUGHT EXCEPTION inside Evolution, NOT an out-of-memory kill
# (an OOM kill is SIGKILL -> exit 137). The trigger was on our side: the app's
# connect screen used to hard logout+delete+recreate this instance every 55s
# while a user paired - up to 4 full Baileys teardowns per attempt. That churn
# is what surfaced the unhandled rejection.
# The real fix lives in the app: /api/wa/connect no longer pre-resets, and
# connectInstance re-issues the pairing code on the SAME instance
# (src/lib/evolution.ts). NODE_OPTIONS below is only headroom insurance - it is
# NOT the fix for exit 1.
# If exit-1 alerts persist, read wd-evolution -> Logs for the stack trace; a
# named subsystem (as with OnWhatsappCache above) points at a targeted env fix.

databases:
  - name: wd-evo-db
    plan: basic-256mb # smallest PAID Postgres (~$6/mo) - never expires
    region: oregon
    databaseName: evolution

services:
  # Free Redis-compatible cache - kills the Prisma cache crash.
  - type: keyvalue
    name: wd-evo-redis
    plan: free
    region: oregon
    ipAllowList: [] # internal connections only

  # UNATTENDED QUEUE DRAIN. Without an always-on drain, nothing drains the outbox when no
  # browser tab is open - queued introductions and the agents' timed replies
  # would just sit until someone opened the app. This tiny cron hits the
  # app's /api/wa/ping every minute, which drains the outbox + graph wakeups AND
  # kicks the self-chaining tick (one ping keeps the drain progressing for the
  # following ~30 min). So messages flow on time with the app fully closed.
  #
  # OWNER: set two env vars on this cron in the Render dashboard after the first
  # sync (both are marked sync:false so they are never committed):
  #   WD_APP_URL    = https://<your-app>.run.app   (no trailing slash)
  #   WD_PING_TOKEN = the webhook token shown in the app at Owner -> Keys
  # Every-minute cadence keeps agent replies landing within ~1-2 min; relax the
  # schedule to "*/2 * * * *" or "*/5 * * * *" if you want to trim cron cost.
  - type: cron
    name: wd-queue-drain
    runtime: docker
    dockerfilePath: ./deploy/ping/Dockerfile
    dockerContext: ./deploy/ping
    schedule: "*/1 * * * *"
    region: oregon
    # The command lives in the image's CMD (exec array) - NO inline dockerCommand
    # string for Render to mis-parse (the earlier exit-127 "command not found").
    # ping.mjs reads WD_APP_URL + WD_PING_TOKEN from the env and hits /api/wa/ping.
    envVars:
      - key: WD_APP_URL
        sync: false
      - key: WD_PING_TOKEN
        sync: false

  # EVOLUTION-POSTGRES RETENTION (owner report 6 J4; ENABLED in owner report 8).
  #
  # WHY THIS IS NO LONGER OPTIONAL. The Baileys store persists every Message
  # AND MessageUpdate row forever (DATABASE_SAVE_DATA_NEW_MESSAGE and
  # _MESSAGE_UPDATE are both true below) while the recovery sweep reads only a
  # 10-row tail per chat. At a 50-user beta that is roughly 4,500 Message rows
  # a day at 1-3 KB each - about 9-15 MB/day into a 256 MB database, i.e. FULL
  # in 17-28 days. A full Postgres is not a slow queue: Prisma writes start
  # failing and that is the documented Evolution crash class, which drops every
  # linked socket at once.
  #
  # DAILY at 7 days, not monthly at 30. The old commented block would have
  # fired for the first time AFTER the disk was already full, and 30 days of
  # retention is itself about one full fill. Seven days is far more than the
  # 10-row tail anything actually reads.
  #
  # OWNER: this is the one item here with a deadline, and the Blueprint cannot
  # currently deliver it (see the header). Create it BY HAND instead - Render
  # dashboard -> New + -> Cron Job -> branch `master`, region Oregon, runtime
  # Docker, Root Directory `deploy/prune`, Dockerfile `./deploy/prune/Dockerfile`,
  # schedule `0 4 * * *`, env PRUNE_DAYS=7 and EVO_DATABASE_URL = the Internal
  # Database URL from wd-evo-db -> Connect. Then hit "Run now" once and read the
  # log; that single run is the proof. The script is defensive - every statement
  # is IF-EXISTS guarded and a renamed table degrades to a logged no-op rather
  # than a red cron.
  - type: cron
    name: wd-evo-prune
    runtime: docker
    dockerfilePath: ./deploy/prune/Dockerfile
    dockerContext: ./deploy/prune
    schedule: "0 4 * * *"
    region: oregon
    envVars:
      - key: PRUNE_DAYS
        value: "7"
      - key: EVO_DATABASE_URL
        fromDatabase:
          name: wd-evo-db
          property: connectionString

  - type: web
    name: wd-evolution
    runtime: docker
    plan: starter # smallest PAID web plan (~$7/mo) - never sleeps
    region: oregon
    dockerfilePath: ./deploy/evolution/Dockerfile
    dockerContext: ./deploy/evolution
    healthCheckPath: /
    envVars:
      # Evolution listens on 8080; tell Render to route + health-check that port
      # (otherwise Render probes its default 10000, sees nothing, and fails).
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      # SECRET LIVES IN THE DASHBOARD, NEVER IN GIT (owner report 6, J1).
      # A literal here was committed once and is therefore burned - and worse,
      # every Blueprint sync RE-ASSERTED the burned value over any rotation
      # done in the dashboard, so dashboard-only rotation silently undid
      # itself. sync:false makes the dashboard the single owner: rotate there,
      # and the Blueprint stops fighting you. OWNER ACTION: set a fresh key in
      # the Render dashboard (Environment -> AUTHENTICATION_API_KEY) and paste
      # the same value in Admin -> Keys (EVOLUTION_API_KEY) so the app's
      # calls keep authenticating.
      - key: AUTHENTICATION_API_KEY
        sync: false
      # Heap ceiling below the 512MB container limit so V8 collects hard instead
      # of the box being SIGKILLed under a burst. Insurance only - the crashes
      # we actually saw were exit 1 (uncaught exception), not exit 137 (OOM).
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: wd-evo-db
          property: connectionString
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      # NOTHING IN src/ READS EVOLUTION'S MessageUpdate TABLE - delivery and
      # read receipts reach us as webhook EVENTS, which ingest handles live.
      # Persisting them was 2-3 extra rows per outbound message written purely
      # to be pruned later, on the plan whose disk is the constraint.
      - key: DATABASE_SAVE_DATA_MESSAGE_UPDATE
        value: "false"
      # Don't sync the full contact book (heavy); chats + messages are enough
      # for the funnel and for teaching from named numbers.
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "false"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "true"
      # THE CRASH FIX: stop persisting "is on WhatsApp" lookups via Prisma.
      - key: DATABASE_SAVE_IS_ON_WHATSAPP
        value: "false"
      # THE CRASH FIX part 2: cache in Redis (free Key Value above), not Prisma.
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        fromService:
          type: keyvalue
          name: wd-evo-redis
          property: connectionString
      - key: CACHE_REDIS_PREFIX_KEY
        value: evolution
      - key: CACHE_REDIS_SAVE_INSTANCES
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "false"
      # DEVICE FINGERPRINT - do NOT put the product name here.
      #
      # Evolution passes this straight into makeWASocket as browser[0], so it is
      # the label Meta sees for every linked companion device. It used to read
      # "WheelDeal", which meant every traveller using this service advertised
      # the same product name: a perfect clustering key, on the enforcement axis
      # whose penalty is a FULL ban rather than a scoped restriction. One rule
      # keyed on that string would catch the entire fleet at once.
      #
      # "Mac OS" + "Chrome" is what ANTI-BAN.md always said to use, and it is
      # also what Baileys' own default (Browsers.macOS('Chrome')) produces - so
      # pairing-code links, which ignore these vars entirely, now present the
      # same fingerprint as QR links instead of a second distinguishable dialect.
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: Mac OS
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      # ---- Throughput / load tuning (handle many concurrent sessions) --------
      # Quieter logs = less CPU/IO under load.
      - key: LOG_LEVEL
        value: "ERROR"
      - key: LOG_BAILEYS
        value: "error"
      # We consume events via HTTP webhooks, not the socket API - turning the
      # websocket server off frees memory per connection.
      - key: WEBSOCKET_ENABLED
        value: "false"
      # Many instances on one process => raise the emitter ceiling so Node does
      # not warn/leak under a few hundred live sessions.
      - key: EVENT_EMITTER_MAX_LISTENERS
        value: "500"

# ---------------------------------------------------------------------------
# KEEP-ALIVE: with `plan: starter` the service never sleeps. The `wd-queue-drain`
# cron above now hits /api/wa/ping every minute (unattended outbox drain + host
# health ping), so an external cron-job.org schedule is optional backup only.
#
# SCALING TO HUNDREDS OF CONCURRENT SESSIONS
# ---------------------------------------------------------------------------
# The app already spreads users across a POOL of Evolution hosts (Owner ->
# Keys -> EVOLUTION_HOSTS, one url|key per line) and fails over automatically,
# so horizontal scale = add more hosts. To go big on ONE deployment:
#   1. Bump `plan: starter` -> `standard` (2 GB+ RAM). A 512 MB starter holds
#      ~30-50 live WhatsApp sockets; 2 GB holds a few hundred.
#   2. Redis is already wired (above) so multiple instances can coordinate -
#      raise `numInstances` when you outgrow one.
# Do NOT push more raw throughput than the anti-ban engine allows - the
# per-number caps are the real limit that keeps every user's number safe.
